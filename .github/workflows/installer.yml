name: Installer

# Full cross-platform matrix for the installer code. Documentation, skills, specs
# and licenses run the one-job drift workflow instead (installer-drift.yml).
on:
  pull_request:
    # Draft pull requests run nothing; CI starts when the pull request is ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "installer/**"
      - ".github/workflows/installer.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Skip drafts, and pull requests from main into development: main was tested before it merged.
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.head_ref != 'main')
    strategy:
      fail-fast: false
      matrix:
        # Both Node versions on Linux; the newest on Windows and macOS, which cover
        # paths, symbolic links, line endings and the Windows command shell.
        include:
          - { os: ubuntu-latest, node: "22.12.0" }
          - { os: ubuntu-latest, node: "24" }
          - { os: windows-latest, node: "24" }
          - { os: macos-latest, node: "24" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        # The dependency tree is the same everywhere; audit it once.
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm audit --audit-level=moderate
      - name: Type check
        run: npm run typecheck
      - name: Build and test
        run: npm test
