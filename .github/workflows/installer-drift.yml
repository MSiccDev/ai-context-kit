name: Installer drift

# One Linux job for changes outside the installer code: the drift tests read these
# homes of the facts the installer depends on, and the full suite checks the
# bundled skills, templates and licenses. Installer code runs the matrix in installer.yml.
on:
  pull_request:
    # Draft pull requests run nothing; CI starts when the pull request is ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "skills/**"
      - "specs/**"
      - "templates/**"
      - "docs/adr/**"
      - "openspec/**"
      - "install.md"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - ".agents/skills/**"
      - ".github/workflows/installer-drift.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    # Skip drafts, and pull requests from main into development: main was tested before it merged.
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.head_ref != 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Type check
        run: npm run typecheck
      - name: Build and test
        run: npm test
