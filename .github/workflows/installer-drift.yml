name: Installer drift
on:
  pull_request:
    paths:
      # Homes of the facts the installer depends on; the drift tests read them.
      # Installer, skill and license changes run the full matrix in installer.yml.
      - "specs/**"
      - "templates/**"
      - "docs/adr/**"
      - "openspec/**"
      - "install.md"
      - "README.md"
      - ".agents/skills/**"
      - ".github/workflows/installer-drift.yml"
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs; every push to main is a release and runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Type check
        run: npm run typecheck
      - name: Build and test
        run: npm test
