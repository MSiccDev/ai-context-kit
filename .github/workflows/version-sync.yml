name: Version sync

on:
  pull_request:
    paths:
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "CHANGELOG.md"
      - "installer/package.json"
      - "installer/package-lock.json"
      - "scripts/check-version-sync.sh"
      - "scripts/test-check-version-sync.sh"
      - ".github/workflows/version-sync.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs; every push to main is a release and runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the version check
        run: bash scripts/test-check-version-sync.sh
      - name: Check manifest and changelog versions match
        run: bash scripts/check-version-sync.sh
