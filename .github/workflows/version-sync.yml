name: Version sync

on:
  # Versions only have to agree when a release or hotfix goes into main.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".claude-plugin/**"
      - ".codex-plugin/**"
      - "CHANGELOG.md"
      - "installer/package.json"
      - "installer/package-lock.json"
      - "scripts/check-version-sync.sh"
      - "scripts/test-check-version-sync.sh"
      - ".github/workflows/version-sync.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the version check
        run: bash scripts/test-check-version-sync.sh
      - name: Check manifest and changelog versions match
        run: bash scripts/check-version-sync.sh
