name: Release

# Stages @msiccdev/ai-context-kit on npm with trusted publishing (no token); a
# maintainer approves the staged version with their second factor.
# Every push to main is a release; a version already on npm stages nothing.
# Pull requests run only the dry run. See installer/RELEASING.md.
on:
  pull_request:
    # Draft pull requests run nothing; CI starts when the pull request is ready.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "installer/package.json"
      - "installer/package-lock.json"
      - "installer/RELEASING.md"
      - ".github/workflows/release.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded pull-request runs; a run on main always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Trusted publishing needs Node 22.14 or later; `npm stage` needs npm 11.15.0 or later.
  NPM_VERSION: "11.21.3"

jobs:
  verify:
    # Skip drafts, and pull requests from main into development: main was tested before it merged.
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.head_ref != 'main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: installer
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      published: ${{ steps.plan.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - name: Install npm
        run: npm install -g "npm@${NPM_VERSION}"
      # The pull request's installer workflows ran the tests, audit and type check;
      # verify only builds the package (prepack) and dry-runs the release.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Plan the release
        id: plan
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          if npm view "${name}@${version}" version >/dev/null 2>&1; then published=true; else published=false; fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "published=${published}" >> "$GITHUB_OUTPUT"
          echo "${name}@${version}: dist-tag ${tag}, already on npm: ${published}"
      - name: Stage (dry run)
        if: steps.plan.outputs.published == 'false'
        run: npm stage publish --dry-run --access public --tag "${{ steps.plan.outputs.tag }}"
      # npm refuses even a dry run for a version that is already on npm, so pack instead.
      - name: Pack (dry run, version already on npm)
        if: steps.plan.outputs.published == 'true'
        run: npm pack --dry-run

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.published == 'false'
    runs-on: ubuntu-latest
    # Deployments to this environment are limited to main; the npm trusted publisher names it.
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: installer/package-lock.json
      - name: Install npm
        run: npm install -g "npm@${NPM_VERSION}"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # The trusted publisher allows `npm stage publish` only; approve the staged
      # version on npmjs.com (Staged Packages) or with `npm stage approve`.
      - name: Stage
        run: npm stage publish --access public --tag "${{ needs.verify.outputs.tag }}"
